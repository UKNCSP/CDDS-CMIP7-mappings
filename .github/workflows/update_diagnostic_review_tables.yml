# This action relies on the existence of 'diagnostic_review/summary_<model>_<experiment>_<timerange>.csv'. Changes to
# the structure or naming convention of these files may result in action failure.
name: Update diagnostic review tables
run-name: Update diagnostic review tables
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  update-tables:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: checkout repo content
        uses: actions/checkout@v3

      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
    
      - name: Install dependencies
        # Versions should be locked for additional security
        run: |
          pip install "pandas==2.3.3"
          pip install "ipython==9.13.0"

      - name: run py script
        # Python script should run once for each argument. Each arg points to a file of the format
        # 'diagnostic_review/summary_<model>_<experiment>_<timerange>.csv'.
        run: |
          args=(
            "UKCM2-0-LL_1pctCO2_189901-191001"
            "UKCM2-0-LL_amip_200001-201001"
            "UKCM2-0-LL_historical_190001-191001"
            "UKCM2a-0-HH_1pctCO2_185001-185003"
            "UKCM2a-0-HH_1pctCO2_185001-185201"
            "UKESM1-3-LL_esm-hist_19000101-19100101"
            "UKESM1-3-LL_esm-piControl_19000101-19100101"
            "UKESM1-3-LL_esm-piControl_19050101-19100101"
            "UKESM1-3-LL_esm-piControl_20000101-20100101"
          )
          for arg in "${args[@]}"; do
            python diagnostic_review/review_diagnostic_table.py "$arg"
          done

          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "Update diagnostic review tables" || echo "No changes to commit"
          git push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
